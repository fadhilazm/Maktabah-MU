  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ivory); color:var(--ink); font-family:var(--body); }
  ::selection{ background:var(--gold-soft); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{ font-family:var(--body); }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .max{ max-width:1160px; margin:0 auto; padding:0 20px; }

  header.top{
    position:relative; color:var(--ivory); border-bottom:3px solid var(--gold);
    background-image: linear-gradient(160deg, rgba(30,50,39,.88), rgba(51,81,63,.80)), var(--hero-img);
    background-size:cover; background-position:center 35%;
  }
  .dash-banner{ position:relative; border-radius:12px; overflow:hidden; margin-bottom:20px; min-height:150px; display:flex; align-items:flex-end; }
  .dash-banner-bg{ position:absolute; inset:0; background-image:var(--hero2-img); background-size:cover; background-position:center 30%; }
  .dash-banner-overlay{ position:relative; z-index:1; width:100%; padding:16px 18px; background:linear-gradient(0deg, rgba(30,50,39,.92), rgba(30,50,39,.15)); color:var(--ivory); }
  .dash-banner-title{ font-family:var(--display); font-size:17px; font-weight:600; margin:0 0 4px; }
  .dash-banner-sub{ font-size:12px; color:var(--gold-soft); margin:0; }
  .hero-search{ display:flex; gap:8px; margin-top:10px; max-width:440px; }
  .hero-search input{ flex:1; min-width:0; padding:11px 14px; border-radius:8px; border:none; font-size:13.5px; font-family:var(--body); }
  .hero-search button{ padding:11px 16px; border-radius:8px; border:none; background:var(--gold); color:var(--plum-deep); font-weight:800; cursor:pointer; font-size:13px; white-space:nowrap; }

  .quick-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:10px; margin-bottom:22px; }
  .quick-tile{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 8px; text-align:center; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .quick-tile:active{ transform:scale(.96); }
  .quick-tile:hover{ box-shadow:0 6px 16px rgba(31,51,39,.12); border-color:var(--gold); }
  .quick-tile-icon{ width:44px; height:44px; margin:0 auto 8px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--ivory-deep); }
  .quick-tile-label{ font-size:11px; font-weight:700; color:var(--ink); line-height:1.25; }
  .brand-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:26px 0 16px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.22em; color:var(--gold-soft); text-transform:uppercase; margin-bottom:8px; }
  h1.brand{ font-family:var(--display); font-size:clamp(22px,3vw,32px); font-weight:600; margin:0; line-height:1.15; }
  .brand-sub{ margin:6px 0 0; color:var(--gold-soft); font-size:13px; }
  .mode-badge{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.12); color:var(--gold-soft); cursor:pointer; border:1px solid rgba(228,206,135,.4); }

  .group-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:0; }
  .group-btn{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; white-space:nowrap; padding:9px 13px; cursor:pointer; border:none; border-radius:8px 8px 0 0; background:rgba(255,255,255,.08); color:var(--ivory); }
  .group-btn.active{ background:var(--ivory-deep); color:var(--plum); }

  .subtabs{ display:flex; gap:6px; overflow-x:auto; padding:12px 0; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .sub-btn{ font-size:12.5px; font-weight:600; white-space:nowrap; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; }

/* Lazy-load QR libraries only when actually needed (Scan / Cetak Label / Kartu),
   so a slow or blocked CDN never prevents the main app from rendering. */
const _scriptCache = {};
function loadScript(src){
  if(_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error("Gagal memuat "+src));
    document.body.appendChild(s);
  });
  return _scriptCache[src];
}
async function loadScriptWithFallback(urls){
  let lastErr;
  for(const url of urls){
    try{ await loadScript(url); return true; }
    catch(e){ lastErr = e; }
  }
  throw lastErr;
}
async function ensureJsQR(){
  if(typeof jsQR === "function") return true;
  try{
    await loadScriptWithFallback([
      "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
      "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js",
    ]);
    return true;
  }catch(e){ showToast("Gagal memuat pustaka scan (cek koneksi internet)","rose"); return false; }
}

function suggestKode(kategori, books){
  const nums = books.map(b=>b.kode||"").filter(k=>k.toUpperCase().startsWith(kategori))
    .map(k=>parseInt(k.slice(kategori.length),10)).filter(n=>!isNaN(n));
  const next = nums.length ? Math.max(...nums)+1 : 1;
  return `${kategori}${pad4(next)}`;
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function toCSV(rows){
  return rows.map(r => r.map(c => `"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
}
function parseCSV(text){
  return text.trim().split(/\r?\n/).map(line=>{
    const out=[]; let cur=""; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(inQ){
        if(ch==='"' && line[i+1]==='"'){ cur+='"'; i++; }
        else if(ch==='"'){ inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ out.push(cur); cur=""; }
        else cur+=ch;
      }
    }
    out.push(cur); return out;
  });
}

/* ============ PERSISTENCE ============ */
const STORAGE_KEY = "maktabah-alfaruq-v4";
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      const payload = JSON.stringify({
        books:state.books, loans:state.loans, kategoriList:state.kategoriList,
        anggota:state.anggota, rakList:state.rakList, kontribList:state.kontribList,
        targetLiterasi:state.targetLiterasi, settings:state.settings
      });
      // Prefer window.storage when available (inside Claude artifact preview);
      // otherwise fall back to real browser localStorage so data actually
      // survives reloads when hosted on GitHub Pages / Netlify / etc.
      if(window.storage && typeof window.storage.set === "function"){
        window.storage.set(STORAGE_KEY, payload, true).catch(()=>{ try{ localStorage.setItem(STORAGE_KEY, payload); }catch(e){} });
      }else{
        localStorage.setItem(STORAGE_KEY, payload);
      }
    }catch(e){ console.error("Gagal menyimpan", e); }
  }, 300);
}
async function loadData(){
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === "function"){
      try{
        const res = await window.storage.get(STORAGE_KEY, true);
        if(res && res.value) raw = res.value;
      }catch(e){ /* not available here — fall through to localStorage */ }
    }
    if(!raw){
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const p = JSON.parse(raw);
      if(p.books) state.books=p.books;
      if(p.loans) state.loans=p.loans;
      if(p.kategoriList) state.kategoriList=p.kategoriList;
      if(p.anggota) state.anggota=p.anggota;
      if(p.rakList) state.rakList=p.rakList;
      if(p.kontribList) state.kontribList=p.kontribList;
      if(p.targetLiterasi) state.targetLiterasi=p.targetLiterasi;
      if(p.settings) state.settings={...state.settings, ...p.settings};
    }
  }catch(e){ console.error("Gagal memuat data tersimpan", e); }
  state.loaded=true;
}

function hariTerlambat(l){
  const ref = l.status==="dikembalikan" ? new Date(l.tanggalKembali) : todayDate;
  const diff = Math.floor((ref - new Date(l.tanggalJatuhTempo)) / 86400000);
  return Math.max(0, diff);
}

function addKategoriFromForm(){
  const kode=(document.getElementById("nk_kode").value||"").trim().toUpperCase();
  const nama=(document.getElementById("nk_nama").value||"").trim();
  if(!kode||!nama) return;
  if(state.kategoriList.some(k=>k.kode===kode)){ showToast(`Kode kategori "${kode}" sudah ada`,"rose"); return; }
  state.kategoriList.push({kode,nama,color:KAT_PALETTE[state.kategoriList.length % KAT_PALETTE.length]});
  scheduleSave();
}
function updateKategoriField(oldKode, field, value){
  if(field==="kode"){
    const nk=value.trim().toUpperCase(); if(!nk) return;
    if(state.kategoriList.some(k=>k.kode===nk && k.kode!==oldKode)){ showToast(`Kode "${nk}" sudah dipakai`,"rose"); return; }
    state.kategoriList = state.kategoriList.map(k=>k.kode===oldKode?{...k,kode:nk}:k);
    state.books = state.books.map(b=>b.kategori===oldKode?{...b,kategori:nk}:b);
    if(state.katFilter===oldKode) state.katFilter=nk;
  }else{
    state.kategoriList = state.kategoriList.map(k=>k.kode===oldKode?{...k,[field]:value}:k);
  }
  scheduleSave();
}
function deleteKategoriRow(kode){
  if(!guardAdmin()) return;
  if(state.books.some(b=>b.kategori===kode)){ showToast("Pindahkan dulu buku dari kategori ini", "rose"); return; }
  if(confirm(`Hapus kategori "${kode}"?`)){ state.kategoriList=state.kategoriList.filter(k=>k.kode!==kode); if(state.katFilter===kode) state.katFilter="Semua"; scheduleSave(); }
}

function renderKatalogGrid(){
  const grid=document.getElementById("katalogGrid"); if(!grid) return;
  const q=state.search.toLowerCase();
  const list = state.books.map(b=>({...b, status:isDipinjam(b.kode)?"dipinjam":"tersedia"}))
    .filter(b=>{
      const mQ = b.judul.toLowerCase().includes(q) || b.penyusun.toLowerCase().includes(q) || b.kode.toLowerCase().includes(q);
      const mK = state.katFilter==="Semua" || b.kategori===state.katFilter;
      const mS = state.statusFilter==="Semua" || b.status===state.statusFilter;
      return mQ && mK && mS;
    }).sort((a,b)=>a.kode.localeCompare(b.kode));
  if(list.length===0){ grid.innerHTML=`<div class="muted" style="text-align:center;padding:50px 0;">Tidak ada buku yang cocok.</div>`; return; }
  grid.innerHTML = `<div class="book-grid">${list.map(b=>{
    const kat=katByKode(b.kategori);
    const loanRec=activeLoans().find(l=>l.kodeBuku===b.kode);
    const late = loanRec ? isOverdue(loanRec) : false;
    const stubLabel = b.statusFisik!=='baik' ? (b.statusFisik==='hilang'?'Hilang':'Rusak') : (b.status==='dipinjam' ? (late?'Terlambat':'Dipinjam') : 'Tersedia');
    const stubColor = b.statusFisik!=='baik' ? '#8C6239' : (b.status==='dipinjam' ? 'var(--rose)' : 'var(--plum)');
    const rak = state.rakList.find(r=>r.kode===b.rak);
    return `
      <div class="book-card">
        <div class="row-between">
          <span class="kode-chip" style="background:${kat.color}">${esc(b.kode)}</span>
          <span class="due-stub" style="border:1.5px solid ${stubColor};color:${stubColor};${(b.status==='dipinjam'&&late)?'background:var(--rose-soft);':''}"><span class="due-dot" style="background:${stubColor}"></span>${stubLabel}</span>
        </div>
        <div class="kat-label" style="color:${kat.color}">${esc(kat.nama)}${rak?` · ${esc(rak.nama)}`:''}</div>
        <h3 class="book-title">${esc(b.judul)}</h3>
        <p class="book-meta">${esc(b.penyusun)} · ${esc(b.penerbit)}</p>
        <p class="book-meta small">Terbit ${esc(b.tahunTerbit)} · ${esc(b.sumber)}${b.keterangan?` · ${esc(b.keterangan)}`:''}</p>
        ${loanRec ? `<p class="book-loan-note">Dipinjam ${esc(loanRec.nama)} (Kls ${esc(loanRec.kelas)}) sejak ${fmt(loanRec.tanggalPinjam)}</p>` : ""}
        <div class="book-actions">
          <button class="btn btn-primary" style="flex:1;justify-content:center;" data-loan="${esc(b.id)}" ${b.status==='dipinjam'||b.statusFisik!=='baik'?'disabled':''}>📖 Pinjamkan</button>
          <button class="icon-btn" data-edit="${esc(b.id)}">✎</button>
          <button class="icon-btn" data-copybook="${esc(b.id)}">⧉</button>
          <button class="icon-btn" data-del="${esc(b.id)}">🗑</button>
        </div>
      </div>`;
  }).join("")}</div>`;
  grid.querySelectorAll("[data-loan]").forEach(b=>b.addEventListener("click", ()=>openLoanModal(b.dataset.loan)));
  grid.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openEditBook(b.dataset.edit)));
  grid.querySelectorAll("[data-copybook]").forEach(b=>b.addEventListener("click", ()=>copyBook(b.dataset.copybook)));
  grid.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>deleteBook(b.dataset.del)));
}

  renderModal();
}
function openEditBook(id){ const b=state.books.find(x=>x.id===id); if(!b) return; state.bookModal={mode:"edit", data:{...b}}; renderModal(); }
function copyBook(id){
  const b=state.books.find(x=>x.id===id); if(!b) return;
  const kode = suggestKode(b.kategori, state.books);
  state.bookModal={mode:"add", data:{...b, id:undefined, kode, judul:b.judul+" (Salinan)"}};
  renderModal();
}
function deleteBook(id){
  if(!guardAdmin()) return;
  const b=state.books.find(x=>x.id===id); if(!b) return;
  if(isDipinjam(b.kode)){ showToast("Tidak bisa dihapus — buku sedang dipinjam","rose"); return; }
  if(confirm(`Hapus "${b.judul}" (${b.kode})?`)){ state.books=state.books.filter(x=>x.id!==id); scheduleSave(); showToast("Buku dihapus","rose"); renderContent(); }
}
function saveBookFromForm(){
  const m=state.bookModal;
  const data={
    ...m.data,
    kategori: document.getElementById("f_kategori").value,
    kode: document.getElementById("f_kode").value.trim().toUpperCase(),
    judul: document.getElementById("f_judul").value.trim(),
    penyusun: document.getElementById("f_penyusun").value.trim(),
    penerbit: document.getElementById("f_penerbit").value.trim(),
    tahunTerbit: document.getElementById("f_tahun").value.trim(),
    sumber: m.data.sumber,
    tanggalDiterima: document.getElementById("f_tanggal").value,
    keterangan: document.getElementById("f_ket").value.trim(),
    rak: document.getElementById("f_rak").value,
    statusFisik: m.data.statusFisik || "baik",
  };
  if(!data.judul){ showToast("Judul buku tidak boleh kosong","rose"); return; }
  if(!data.kode){ showToast("Kode buku tidak boleh kosong","rose"); return; }
  if(state.books.some(b=>b.kode===data.kode && b.id!==data.id)){ showToast(`Kode ${data.kode} sudah dipakai buku lain`,"rose"); return; }
  if(m.mode==="add"){ state.books.push({...data, id:uid()}); showToast(`Buku "${data.judul}" (${data.kode}) ditambahkan`,"plum"); }
  else{
    const old=state.books.find(b=>b.id===data.id); const oldKode=old.kode;
    state.books=state.books.map(b=>b.id===data.id?data:b);
    if(oldKode!==data.kode) state.loans=state.loans.map(l=>l.kodeBuku===oldKode?{...l,kodeBuku:data.kode}:l);
    showToast(`Data buku "${data.judul}" diperbarui`,"plum");
  }
  scheduleSave(); state.bookModal=null; renderModal(); renderContent();
}

function rekapLiterasiHTML(){
  const rows = state.anggota.map(a=>{

    const pct = target>0 ? Math.min(100, Math.round(total/target*100)) : 0;
    return {a, total, target, pct};
  }).sort((a,b)=>b.total-a.total);
  return `<h3 class="panel-title">Rekap Literasi Seluruh Anggota</h3>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Nama</th><th>Kelas</th><th>Buku Dibaca</th><th>Target</th><th>Capaian</th></tr></thead><tbody>

    </tbody></table></div>`;
}
function targetHTML(){
  const ranking = [...state.anggota].map(a=>({a, total:bacaanAnggota(a.id).length})).sort((x,y)=>y.total-x.total).slice(0,5);

      ${["1","2","3","4","5","6"].map(k=>{

/* ============ LAPORAN ============ */
function inRange(dateStr){
  if(!dateStr) return false;
  if(state.laporanFrom && dateStr < state.laporanFrom) return false;
  if(state.laporanTo && dateStr > state.laporanTo) return false;
  return true;
}
function laporanHTML(){
  const s = state.sub;
  const rangeBar = `<div class="toolbar"><div class="field"><label class="field-label">Dari</label><input type="date" id="lapFrom" value="${state.laporanFrom}"/></div><div class="field"><label class="field-label">Sampai</label><input type="date" id="lapTo" value="${state.laporanTo}"/></div><button class="btn btn-outline" id="btnExportLaporan" style="margin-left:auto;align-self:flex-end;">⬇ Export CSV</button></div>`;
  let body = "";
  if(s==="buku"){
    body = tableWrap(["Kode","Judul","Kategori","Status","Rak"], state.books.map(b=>[b.kode,b.judul,katByKode(b.kategori).nama, b.statusFisik!=='baik'?b.statusFisik:(isDipinjam(b.kode)?'Dipinjam':'Tersedia'), (state.rakList.find(r=>r.kode===b.rak)||{}).nama||'-']));
  }else if(s==="anggota"){
    body = tableWrap(["NIS","Nama","Kelas","L/P","Terdaftar"], state.anggota.map(a=>[a.nis,a.nama,a.kelas,a.lp,fmt(a.tglDaftar)]));
  }else if(s==="peminjaman"){
    const rows = state.loans.filter(l=>!state.laporanFrom&&!state.laporanTo ? true : inRange(l.tanggalPinjam));
    body = tableWrap(["Kode","Judul","Peminjam","Kelas","Tgl Pinjam","Jatuh Tempo","Status"], rows.map(l=>[l.kodeBuku,l.judulBuku,l.nama,l.kelas,fmt(l.tanggalPinjam),fmt(l.tanggalJatuhTempo),l.status]));
  }else if(s==="pengembalian"){
    const rows = historyLoans().filter(l=>!state.laporanFrom&&!state.laporanTo ? true : inRange(l.tanggalKembali));
    body = tableWrap(["Kode","Judul","Peminjam","Tgl Pinjam","Tgl Kembali","Denda"], rows.map(l=>[l.kodeBuku,l.judulBuku,l.nama,fmt(l.tanggalPinjam),fmt(l.tanggalKembali),rupiah(dendaLoan(l))]));
  }else if(s==="keterlambatan"){
    const rows = activeLoans().filter(isOverdue);
    body = tableWrap(["Kode","Judul","Peminjam","Jatuh Tempo","Hari Terlambat"], rows.map(l=>[l.kodeBuku,l.judulBuku,l.nama,fmt(l.tanggalJatuhTempo),hariTerlambat(l)]));
  }else if(s==="denda"){
    const rows = state.loans.filter(l=>dendaLoan(l)>0);
    body = tableWrap(["Kode","Judul","Peminjam","Hari Terlambat","Denda","Status"], rows.map(l=>[l.kodeBuku,l.judulBuku,l.nama,hariTerlambat(l),rupiah(dendaLoan(l)),l.dendaLunas?'Lunas':'Belum']));
  }else if(s==="literasi"){
    body = tableWrap(["Nama","Kelas","Buku Dibaca","Target"], state.anggota.map(a=>[a.nama,a.kelas,bacaanAnggota(a.id).length,(state.targetLiterasi.find(t=>t.kelas===a.kelas)||{target:0}).target]));
  }else if(s==="statistik"){
    return dashboardHTML();
  }
  return rangeBar + body;
}
function tableWrap(headers, rows){
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
    ${rows.length===0?`<tr><td colspan="${headers.length}" class="muted">Tidak ada data.</td></tr>`:rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}
function exportLaporanCSV(){
  const el = document.querySelector(".table-wrap table"); if(!el) return;
  const rows = [...el.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>td.textContent));
  downloadFile(`laporan-${state.sub}-${iso(todayDate)}.csv`, toCSV(rows), "text/csv");
  showToast("Laporan diunduh sebagai CSV", "plum");
}

/* ============ SISTEM: BACKUP & RESTORE ============ */
function backupHTML(){
  return `<div class="settings-card">
    <h3 class="panel-title">Backup & Restore</h3>
    <p class="hint" style="margin-bottom:12px;">Backup menyimpan seluruh data (buku, anggota, transaksi, pengaturan) ke satu file JSON yang bisa disimpan sebagai cadangan.</p>
    <button class="btn btn-primary btn-block" id="backupBtn">⬇ Unduh Backup (.json)</button>
    <div class="field" style="margin-top:16px;"><label class="field-label">Pulihkan dari File Backup</label><input type="file" id="restoreFile" accept="application/json"/></div>
    <p class="hint">Memulihkan akan <b>menimpa semua data saat ini</b> — pastikan sudah backup dulu kalau ragu.</p>
  </div>`;
}
function bindBackup(){
  const b=document.getElementById("backupBtn");
  if(b) b.addEventListener("click", ()=>{
    const data = { books:state.books, loans:state.loans, kategoriList:state.kategoriList, anggota:state.anggota, rakList:state.rakList, kontribList:state.kontribList, targetLiterasi:state.targetLiterasi, settings:state.settings };
    downloadFile(`backup-maktabah-${iso(todayDate)}.json`, JSON.stringify(data,null,2), "application/json");
    showToast("Backup diunduh","plum");
  });
  const f=document.getElementById("restoreFile");
  if(f) f.addEventListener("change", (e)=>{
    if(!guardAdmin()) return;
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload = ()=>{
      try{
        const p = JSON.parse(reader.result);
        if(!confirm("Timpa semua data saat ini dengan file backup ini?")) return;
        if(p.books) state.books=p.books; if(p.loans) state.loans=p.loans; if(p.kategoriList) state.kategoriList=p.kategoriList;
        if(p.anggota) state.anggota=p.anggota; if(p.rakList) state.rakList=p.rakList; if(p.kontribList) state.kontribList=p.kontribList;
        if(p.targetLiterasi) state.targetLiterasi=p.targetLiterasi; if(p.settings) state.settings={...state.settings,...p.settings};
        scheduleSave(); showToast("Data berhasil dipulihkan","plum"); render();
      }catch(err){ showToast("File backup tidak valid","rose"); }
    };
    reader.readAsText(file);
  });
}

function impexpHTML(){
  return `<div class="settings-card">

    <p class="hint" style="margin-bottom:10px;">Kolom CSV: kode,kategori,judul,penyusun,penerbit,tahunTerbit,sumber,tanggalDiterima,rak,keterangan</p>
    <button class="btn btn-outline btn-block" id="exportBukuCsv">⬇ Export Data Buku (.csv)</button>
    <div class="field" style="margin-top:12px;"><label class="field-label">Import Data Buku dari CSV</label><input type="file" id="importBukuCsv" accept=".csv"/></div>
    <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0;"/>
    <h3 class="panel-title">Import / Export Data Anggota (CSV)</h3>
    <p class="hint" style="margin-bottom:10px;">Kolom CSV: nis,nama,kelas,lp,alamat,tglDaftar</p>
    <button class="btn btn-outline btn-block" id="exportAnggotaCsv">⬇ Export Data Anggota (.csv)</button>
    <div class="field" style="margin-top:12px;"><label class="field-label">Import Data Anggota dari CSV</label><input type="file" id="importAnggotaCsv" accept=".csv"/></div>
  </div>`;
}
function bindImpexp(){
  const eb=document.getElementById("exportBukuCsv");
  if(eb) eb.addEventListener("click", ()=>{
    const rows=[["kode","kategori","judul","penyusun","penerbit","tahunTerbit","sumber","tanggalDiterima","rak","keterangan"], ...state.books.map(b=>[b.kode,b.kategori,b.judul,b.penyusun,b.penerbit,b.tahunTerbit,b.sumber,b.tanggalDiterima,b.rak,b.keterangan])];
    downloadFile(`data-buku-${iso(todayDate)}.csv`, toCSV(rows), "text/csv"); showToast("Data buku diekspor","plum");
  });
  const ib=document.getElementById("importBukuCsv");
  if(ib) ib.addEventListener("change", e=>{
    if(!guardAdmin()) return;
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const rows=parseCSV(reader.result); const header=rows[0]; const body=rows.slice(1).filter(r=>r.length>1 && r[0]);
      let added=0;
      body.forEach(r=>{
        const [kode,kategori,judul,penyusun,penerbit,tahunTerbit,sumber,tanggalDiterima,rak,keterangan]=r;
        if(!kode||!judul) return;
        if(state.books.some(b=>b.kode===kode.toUpperCase())) return;
        state.books.push({ id:uid(), kode:kode.toUpperCase(), kategori:kategori||(state.kategoriList[0]?state.kategoriList[0].kode:"A"), judul, penyusun:penyusun||"", penerbit:penerbit||"", tahunTerbit:tahunTerbit||"", sumber:sumber||"Beli", tanggalDiterima:tanggalDiterima||iso(todayDate), rak:rak||"", keterangan:keterangan||"", statusFisik:"baik" });
        added++;
      });
      scheduleSave(); showToast(`${added} buku diimpor`,"plum"); render();
    };
    reader.readAsText(file);
  });
  const ea=document.getElementById("exportAnggotaCsv");
  if(ea) ea.addEventListener("click", ()=>{
    const rows=[["nis","nama","kelas","lp","alamat","tglDaftar"], ...state.anggota.map(a=>[a.nis,a.nama,a.kelas,a.lp,a.alamat,a.tglDaftar])];
    downloadFile(`data-anggota-${iso(todayDate)}.csv`, toCSV(rows), "text/csv"); showToast("Data anggota diekspor","plum");
  });
  const ia=document.getElementById("importAnggotaCsv");
  if(ia) ia.addEventListener("change", e=>{
    if(!guardAdmin()) return;
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const rows=parseCSV(reader.result); const body=rows.slice(1).filter(r=>r.length>1 && r[1]);
      let added=0;
      body.forEach(r=>{
        const [nis,nama,kelas,lp,alamat,tglDaftar]=r;
        if(!nama) return;
        state.anggota.push({ id:uid(), nis:nis||"", nama, kelas:kelas||"1", lp:lp||"L", alamat:alamat||"", tglDaftar:tglDaftar||iso(todayDate) });
        added++;
      });
      scheduleSave(); showToast(`${added} anggota diimpor`,"plum"); render();
    };
    reader.readAsText(file);
  });
}

/* ============ SCAN QR ============ */
let scanStream=null, scanRAF=null;
function scanModalHTML(){
  return `<div class="modal-backdrop" id="scanBackdrop"><div class="modal" style="max-width:380px;">
    <div class="modal-header"><h3 class="modal-title">Scan Kode Buku</h3><button class="close-x" id="closeScanModal">✕</button></div>
    <div class="scan-video-wrap"><video id="scanVideo" playsinline muted></video><div class="scan-frame"></div></div>
    <p class="scan-hint">Arahkan kamera ke QR pada buku...</p>
  </div></div>`;
}
function bindScanModal(){
  document.getElementById("scanBackdrop").addEventListener("click", e=>{ if(e.target.id==="scanBackdrop") stopScan(); });
  document.getElementById("closeScanModal").addEventListener("click", stopScan);
  startScan();
}
async function startScan(){
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const video=document.getElementById("scanVideo"); if(!video) return;
    video.srcObject=scanStream; await video.play();

    if("BarcodeDetector" in window){
      try{
        const detector = new BarcodeDetector({formats:["qr_code"]});
        scanLoopNative(detector);
        return; // native path — no external library needed at all
      }catch(e){ /* unsupported format list etc — fall through to jsQR */ }
    }
    const ok = await ensureJsQR();
    if(!ok){ stopScan(); return; }
    scanLoop();
  }catch(e){ showToast("Tidak bisa akses kamera — pastikan izin kamera & halaman dibuka lewat HTTPS","rose"); stopScan(); }
}
async function scanLoopNative(detector){
  const video=document.getElementById("scanVideo"); if(!video) return;
  if(video.readyState!==video.HAVE_ENOUGH_DATA){ scanRAF=requestAnimationFrame(()=>scanLoopNative(detector)); return; }
  try{
    const codes = await detector.detect(video);
    if(codes && codes.length>0 && codes[0].rawValue){ handleScanResult(String(codes[0].rawValue).trim()); return; }
  }catch(e){}
  scanRAF=requestAnimationFrame(()=>scanLoopNative(detector));
}
function scanLoop(){
  const video=document.getElementById("scanVideo"); if(!video) return;
  if(video.readyState!==video.HAVE_ENOUGH_DATA){ scanRAF=requestAnimationFrame(scanLoop); return; }
  const canvas=document.createElement("canvas"); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d"); ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const code = typeof jsQR==="function" ? jsQR(imageData.data, imageData.width, imageData.height) : null;
  if(code && code.data){ handleScanResult(code.data.trim()); return; }
  scanRAF=requestAnimationFrame(scanLoop);
}
function stopScan(){
  cancelAnimationFrame(scanRAF); scanRAF=null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  state.scanOpen=false; renderModal();
}
function handleScanResult(text){
  stopScan();
  const kode=text.toUpperCase();
  const book=state.books.find(b=>b.kode===kode);
  if(!book){ showToast(`Kode "${kode}" tidak ditemukan`,"rose"); return; }
  if(isDipinjam(book.kode)){
    const loan=activeLoans().find(l=>l.kodeBuku===book.kode);
    if(loan && confirm(`"${book.judul}" dipinjam ${loan.nama}. Kembalikan sekarang?`)) returnLoan(loan.id);
  }else{ openLoanModal(book.id); }
}

/* ============ BOOTSTRAP ============ */
function showFatalError(err){
  const root = document.getElementById("root");
  if(root){
    root.innerHTML = `<div style="max-width:520px;margin:60px auto;padding:24px;font-family:sans-serif;">
      <h2 style="color:#A63D5C;font-family:Georgia,serif;">Terjadi kesalahan saat memuat halaman</h2>
      <p style="color:#6B6178;">Silakan tangkap layar pesan di bawah ini dan kirimkan supaya bisa diperbaiki:</p>
      <pre style="background:#F1E9DA;border:1px solid #E6DCC8;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#241B2E;">${esc(String(err && (err.stack||err.message||err)))}</pre>
      <button onclick="location.reload()" style="margin-top:14px;padding:10px 16px;border:none;border-radius:7px;background:#4A2545;color:#fff;font-weight:700;cursor:pointer;">Muat Ulang</button>
    </div>`;
  }
}
window.addEventListener("error", (e)=>{ showFatalError(e.error||e.message); });
window.addEventListener("unhandledrejection", (e)=>{ showFatalError(e.reason); });

(async function init(){
  try{
    await loadData();
    render();
  }catch(err){
    showFatalError(err);
  }
})();
