<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maktabah Marhalah Ula Al-Faruq — Kalibagor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --ink:#241B2E; --ink-soft:#6B6178;
    --plum:#4A2545; --plum-deep:#2E1730;
    --gold:#C9A227; --gold-soft:#E4CE87;
    --rose:#A63D5C; --rose-soft:#F1DCE1;
    --ivory:#FAF6EF; --ivory-deep:#F1E9DA;
    --card:#FFFFFF; --line:#E6DCC8;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ivory); color:var(--ink); font-family:var(--body); }
  ::selection{ background:var(--gold-soft); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{ font-family:var(--body); }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .max{ max-width:1100px; margin:0 auto; padding:0 24px; }

  /* header */
  header.top{ background:linear-gradient(135deg, var(--plum-deep), var(--plum)); color:var(--ivory); border-bottom:3px solid var(--gold); }
  .brand-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:32px 0 22px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.22em; color:var(--gold-soft); text-transform:uppercase; margin-bottom:8px; }
  h1.brand{ font-family:var(--display); font-size:clamp(26px,3.6vw,38px); font-weight:600; margin:0; line-height:1.15; }
  .brand-sub{ margin:6px 0 0; color:var(--gold-soft); font-size:13.5px; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; }
  .tab-btn{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; white-space:nowrap; padding:10px 16px; cursor:pointer; border:none; border-radius:8px 8px 0 0; background:rgba(255,255,255,.08); color:var(--ivory); }
  .tab-btn.active{ background:var(--ivory); color:var(--plum); transform:translateY(1px); }
  .tab-icon{ font-size:14px; }

  main{ padding:28px 0 60px; }

  /* stat cards */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:22px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; position:relative; overflow:hidden; }
  .stat-blob{ position:absolute; top:-18px; right:-18px; width:70px; height:70px; border-radius:50%; opacity:.10; }
  .stat-icon{ width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; margin-bottom:8px; }
  .stat-value{ font-family:var(--display); font-size:30px; font-weight:600; line-height:1; }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; font-weight:500; }

  .alert-overdue{ display:flex; align-items:center; gap:8px; background:var(--rose-soft); border:1px solid var(--rose); border-radius:8px; padding:10px 14px; color:var(--rose); font-size:13px; font-weight:600; margin-bottom:22px; }

  .dash-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  @media (max-width:760px){ .dash-grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel-title{ font-family:var(--display); font-size:17px; margin:0 0 14px; }
  .muted{ color:var(--ink-soft); font-size:13px; padding:14px 0; }

  .chart-bars{ display:flex; align-items:flex-end; gap:14px; height:200px; padding-top:10px; }
  .chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .chart-val{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .chart-bar{ width:100%; max-width:40px; border-radius:6px 6px 0 0; background:var(--plum); }
  .chart-lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; font-weight:600; }

  .top-list{ display:flex; flex-direction:column; gap:12px; }
  .top-item{ display:flex; align-items:center; gap:12px; }
  .top-rank{ font-family:var(--display); font-size:15px; color:var(--gold); font-weight:700; width:20px; }
  .top-title{ flex:1; font-size:13px; font-weight:600; }
  .top-count{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); }

  .activity-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .activity-item:last-child{ border-bottom:none; }
  .activity-time{ margin-left:auto; font-size:12px; color:var(--ink-soft); white-space:nowrap; }

  /* toolbar */
  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .search-box{ display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--line); border-radius:7px; background:var(--card); flex:1 1 220px; }
  .search-box input{ border:none; outline:none; background:transparent; font-size:14px; width:100%; font-family:var(--body); }
  select, .field input, .field textarea{ padding:9px 10px; border-radius:7px; border:1px solid var(--line); font-size:13px; font-family:var(--body); background:var(--card); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:7px; font-weight:700; font-size:13px; cursor:pointer; border:none; }
  .btn-primary{ background:var(--plum); color:#fff; }
  .btn-outline{ background:#fff; color:var(--plum); border:1px solid var(--plum); }
  .btn-gold{ background:var(--gold); color:var(--plum-deep); }
  .btn:disabled{ background:#D9D2C9 !important; color:#fff !important; cursor:not-allowed; border:none !important; }
  .btn-block{ width:100%; padding:11px; border-radius:7px; font-size:14px; }

  /* book grid */
  .book-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .book-card{ background:var(--card); border:1px solid var(--line); border-radius:9px; padding:16px; display:flex; flex-direction:column; gap:9px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .kode-chip{ font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.03em; padding:3px 8px; border-radius:5px; color:#fff; white-space:nowrap; }
  .due-stub{ display:inline-flex; align-items:center; gap:5px; border-radius:3px 3px 8px 8px; padding:3px 9px 3px 7px; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:#fff; }
  .due-dot{ width:5px; height:5px; border-radius:50%; display:inline-block; }
  .kat-label{ font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; }
  .book-title{ font-family:var(--display); font-size:16.5px; font-weight:600; margin:0; line-height:1.3; }
  .book-meta{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .book-meta.small{ font-size:11.5px; }
  .book-loan-note{ font-size:11.5px; color:var(--rose); margin:0; font-weight:600; }
  .book-actions{ display:flex; gap:8px; margin-top:2px; }
  .icon-btn{ padding:7px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }

  /* loan lists */
  .loan-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:13px 16px; margin-bottom:12px; }
  .loan-row.late{ background:var(--rose-soft); border-color:var(--rose); }
  .loan-left{ display:flex; align-items:center; gap:12px; }
  .loan-title{ font-family:var(--display); font-weight:600; font-size:15px; }
  .loan-sub{ font-size:12.5px; color:var(--ink-soft); }
  .status-tag{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; }

  .history-panel{ background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .history-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
  .history-row:last-child{ border-bottom:none; }

  /* modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(36,27,46,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--card); border-radius:10px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-family:var(--display); font-size:18px; margin:0; }
  .close-x{ background:none; border:none; cursor:pointer; font-size:18px; color:var(--ink-soft); line-height:1; }
  .field{ margin-top:12px; }
  .field:first-child{ margin-top:0; }
  .field-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .field input, .field select{ width:100%; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .radio-group{ display:flex; gap:8px; margin-top:4px; }
  .radio-btn{ flex:1; padding:8px 0; border-radius:6px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-size:12.5px; font-weight:700; cursor:pointer; }
  .radio-btn.active{ border-color:var(--plum); background:var(--plum); color:#fff; }
  .hint{ font-size:11px; color:var(--ink-soft); margin:6px 0 0; }
  .link-btn{ margin-top:4px; background:none; border:none; padding:0; color:var(--plum); font-size:11px; font-weight:700; cursor:pointer; text-decoration:underline; }

  .kat-row{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:7px; padding:8px 10px; margin-bottom:8px; }
  .kat-swatch{ width:26px; height:26px; border:none; border-radius:5px; padding:0; cursor:pointer; flex-shrink:0; }
  .kat-input-kode{ width:64px; padding:6px 7px; border-radius:5px; border:1px solid var(--line); font-size:12.5px; font-family:var(--mono); text-transform:uppercase; }
  .kat-input-nama{ flex:1; min-width:0; padding:6px 7px; border-radius:5px; border:1px solid var(--line); font-size:13px; }
  .kat-del{ background:none; border:none; cursor:pointer; flex-shrink:0; color:var(--rose); font-size:15px; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); color:#fff; padding:10px 18px; border-radius:7px; font-size:13px; font-weight:700; box-shadow:0 8px 22px rgba(0,0,0,.25); z-index:60; }

  footer{ text-align:center; padding:20px 0 32px; color:var(--ink-soft); font-size:12px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============ TOKENS ============ */
const KAT_PALETTE = ["#C9A227","#A63D5C","#7A4A73","#C1653C","#3F5B7A","#8C6239","#4E7A5E","#6B5CA5"];

/* ============ HELPERS ============ */
const uid = () => Math.random().toString(36).slice(2,10);
const pad4 = (n) => String(n).padStart(4,"0");
const todayDate = new Date();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const iso = (d) => new Date(d).toISOString().slice(0,10);
const fmt = (d) => d ? new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}) : "-";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function suggestKode(kategori, books){
  const nums = books.map(b=>b.kode||"").filter(k=>k.toUpperCase().startsWith(kategori))
    .map(k=>parseInt(k.slice(kategori.length),10)).filter(n=>!isNaN(n));
  const next = nums.length ? Math.max(...nums)+1 : 1;
  return `${kategori}${pad4(next)}`;
}

/* ============ SEED DATA ============ */
function seedKategoriList(){
  return [ { kode:"A", nama:"Aqidah & Ibadah", color:"#C9A227" } ];
}
function seedBooks(){
  return [
    { id:"s1", kode:"A0001", kategori:"A", judul:"Indahnya Kehidupan Surga Versi Anak 1", penyusun:"Abu Ishaq Musa", penerbit:"At Tuqa", tahunTerbit:"1443H/2022M", sumber:"Beli", tanggalDiterima:"2022-03-01", keterangan:"" },
    { id:"s2", kode:"A0002", kategori:"A", judul:"Indahnya Kehidupan Surga Versi Anak 2", penyusun:"Abu Ishaq Musa", penerbit:"At Tuqa", tahunTerbit:"1443H/2022M", sumber:"Beli", tanggalDiterima:"2022-03-01", keterangan:"" },
    { id:"s3", kode:"A0011", kategori:"A", judul:"Indahnya Kehidupan Surga (Pengantar)", penyusun:"Fathul Mujib (Pengantar)", penerbit:"At Tuqa", tahunTerbit:"1443H/2021M", sumber:"Beli", tanggalDiterima:"2022-03-01", keterangan:"" },
    { id:"s4", kode:"A0019", kategori:"A", judul:"Pend. Sejarah Islam 4 MI", penyusun:"Fathul Mujib", penerbit:"At Tuqa", tahunTerbit:"1440H/2019M", sumber:"Beli", tanggalDiterima:"2021-09-05", keterangan:"" },
    { id:"s5", kode:"A0026", kategori:"A", judul:"Ayo Menghafal Al Qur'an", penyusun:"Fathul Mujib", penerbit:"Pena Hikmah", tahunTerbit:"1442H/2020M", sumber:"Beli", tanggalDiterima:"2021-09-05", keterangan:"" },
    { id:"s6", kode:"A0028", kategori:"A", judul:"Kisah Hebat Para Ulama", penyusun:"Ust. Abu Umar as-Sidawi", penerbit:"At Tuqa", tahunTerbit:"1442H/2021M", sumber:"Infak", tanggalDiterima:"2021-09-05", keterangan:"Wakaf" },
    { id:"s7", kode:"A0029", kategori:"A", judul:"Khalifah Harun Ar-Rasyid", penyusun:"Al-Ust. Abu Hanan Harts", penerbit:"At Tuqa", tahunTerbit:"1441H/2019M", sumber:"Beli", tanggalDiterima:"2022-04-06", keterangan:"" },
    { id:"s8", kode:"A0030", kategori:"A", judul:"10 Mukjizat Nabi Muhammad", penyusun:"Al. Ust. Abu Amr as-Sidawi", penerbit:"At Tuqa", tahunTerbit:"1440H/2019M", sumber:"Beli", tanggalDiterima:"2022-04-06", keterangan:"" },
    { id:"s9", kode:"A0031", kategori:"A", judul:"Keajaiban Hewan, Pohon, dan Batu dalam Al Qur'an dan Hadits", penyusun:"Ummu Abdil Aziz Asma", penerbit:"At Tuqa", tahunTerbit:"1441H/2019M", sumber:"Beli", tanggalDiterima:"2022-04-06", keterangan:"" },
  ];
}
function seedLoans(){
  return [
    { id:uid(), kodeBuku:"A0001", judulBuku:"Indahnya Kehidupan Surga Versi Anak 1", nama:"Muhammad Rizki", kelas:"1", tanggalPinjam:iso(addDays(todayDate,-4)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0002", judulBuku:"Indahnya Kehidupan Surga Versi Anak 2", nama:"Fatimah Azzahra", kelas:"2", tanggalPinjam:iso(addDays(todayDate,-2)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0011", judulBuku:"Indahnya Kehidupan Surga (Pengantar)", nama:"Yusuf Ibrahim", kelas:"3", tanggalPinjam:iso(addDays(todayDate,-6)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0019", judulBuku:"Pend. Sejarah Islam 4 MI", nama:"Zahra Amelia", kelas:"4", tanggalPinjam:iso(addDays(todayDate,-1)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0026", judulBuku:"Ayo Menghafal Al Qur'an", nama:"Afifah N. H", kelas:"5", tanggalPinjam:iso(addDays(todayDate,-9)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0028", judulBuku:"Kisah Hebat Para Ulama", nama:"Abdullah Malik", kelas:"6", tanggalPinjam:iso(addDays(todayDate,-3)), tanggalKembali:null, status:"dipinjam" },
    { id:uid(), kodeBuku:"A0029", judulBuku:"Khalifah Harun Ar-Rasyid", nama:"Nabiya", kelas:"5", tanggalPinjam:iso(addDays(todayDate,-20)), tanggalKembali:iso(addDays(todayDate,-13)), status:"dikembalikan" },
    { id:uid(), kodeBuku:"A0030", judulBuku:"10 Mukjizat Nabi Muhammad", nama:"Khonsa", kelas:"2", tanggalPinjam:iso(addDays(todayDate,-16)), tanggalKembali:iso(addDays(todayDate,-9)), status:"dikembalikan" },
  ];
}

/* ============ STATE ============ */
let state = {
  books: seedBooks(),
  loans: seedLoans(),
  kategoriList: seedKategoriList(),
  loaded: false,
  tab: "dashboard",
  search: "",
  katFilter: "Semua",
  statusFilter: "Semua",
  bookModal: null,      // { mode:'add'|'edit', data:{...} }
  loanTarget: null,     // book object
  katModalOpen: false,
};

const TABS = [
  { key:"dashboard", label:"Dashboard", icon:"◧" },
  { key:"katalog", label:"Katalog Buku", icon:"▤" },
  { key:"aktif", label:"Peminjaman Aktif", icon:"◔" },
  { key:"riwayat", label:"Riwayat", icon:"↺" },
];

/* ============ PERSISTENCE ============ */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await window.storage.set("maktabah-alfaruq-v3", JSON.stringify({
        books: state.books, loans: state.loans, kategoriList: state.kategoriList
      }), true);
    }catch(e){ console.error("Gagal menyimpan", e); }
  }, 300);
}

async function loadData(){
  try{
    const res = await window.storage.get("maktabah-alfaruq-v3", true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed.books) state.books = parsed.books;
      if(parsed.loans) state.loans = parsed.loans;
      if(parsed.kategoriList) state.kategoriList = parsed.kategoriList;
    }
  }catch(e){ /* belum ada data tersimpan — pakai contoh */ }
  state.loaded = true;
}

/* ============ DERIVED HELPERS ============ */
const katByKode = (kode) => state.kategoriList.find(k=>k.kode===kode) || { kode, nama:"Tanpa kategori", color:"#6B6178" };
const isDipinjam = (kode) => state.loans.some(l=>l.kodeBuku===kode && l.status==="dipinjam");
const bookByKode = (kode) => state.books.find(b=>b.kode===kode);
const activeLoans = () => state.loans.filter(l=>l.status==="dipinjam").sort((a,b)=>new Date(a.tanggalPinjam)-new Date(b.tanggalPinjam));
const historyLoans = () => state.loans.filter(l=>l.status==="dikembalikan").sort((a,b)=>new Date(b.tanggalKembali)-new Date(a.tanggalKembali));
const isOverdue = (l) => new Date(l.tanggalPinjam) < addDays(todayDate,-7);

/* ============ TOAST ============ */
let toastTimer = null;
function showToast(msg, tone){
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast" style="background:${tone==='rose' ? 'var(--rose)' : 'var(--plum)'}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML = ""; }, 2600);
}

/* ============ ROOT RENDER ============ */
function render(){
  const root = document.getElementById("root");
  root.innerHTML = `
    <header class="top">
      <div class="max">
        <div class="brand-row">
          <div>
            <div class="eyebrow">Buku Induk Digital &nbsp;·&nbsp; Est. Kalibagor</div>
            <h1 class="brand">Maktabah Marhalah Ula Al-Faruq</h1>
            <p class="brand-sub">Kalibagor, Banyumas — Jawa Tengah</p>
          </div>
        </div>
        <div class="tabs">
          ${TABS.map(t=>`
            <button class="tab-btn ${state.tab===t.key?'active':''}" data-tab="${t.key}">
              <span class="tab-icon">${t.icon}</span> ${t.label}${t.key==='aktif' ? ` (${activeLoans().length})` : ''}
            </button>
          `).join("")}
        </div>
      </div>
    </header>
    <main><div class="max" id="content"></div></main>
    <footer>Data disimpan bersama (shared) untuk semua pengguna halaman ini · Buku Induk Maktabah Marhalah Ula Al-Faruq, Kalibagor</footer>
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
  `;
  document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click", ()=>{ state.tab = b.dataset.tab; render(); }));
  renderContent();
  renderModal();
}

function renderContent(){
  const el = document.getElementById("content");
  if(state.tab==="dashboard") el.innerHTML = dashboardHTML();
  if(state.tab==="katalog"){ el.innerHTML = katalogShellHTML(); bindKatalogToolbar(); renderKatalogGrid(); }
  if(state.tab==="aktif") el.innerHTML = aktifHTML();
  if(state.tab==="riwayat") el.innerHTML = riwayatHTML();
  bindContentActions();
}

/* ============ DASHBOARD ============ */
function dashboardHTML(){
  const al = activeLoans();
  const overdueCount = al.filter(isOverdue).length;
  const returnedThisMonth = state.loans.filter(l=>l.tanggalKembali && new Date(l.tanggalKembali).getMonth()===todayDate.getMonth() && new Date(l.tanggalKembali).getFullYear()===todayDate.getFullYear()).length;
  const anggotaAktif = new Set(al.map(l=>l.nama)).size;

  const perKelasMap = {};
  state.loans.forEach(l=>{ perKelasMap[l.kelas] = (perKelasMap[l.kelas]||0)+1; });
  const perKelas = Object.entries(perKelasMap).map(([kelas,jumlah])=>({kelas,jumlah})).sort((a,b)=>a.kelas.localeCompare(b.kelas));
  const maxJumlah = Math.max(1, ...perKelas.map(p=>p.jumlah));

  const topMap = {};
  state.loans.forEach(l=>{ topMap[l.judulBuku] = (topMap[l.judulBuku]||0)+1; });
  const topBuku = Object.entries(topMap).map(([judul,jumlah])=>({judul,jumlah})).sort((a,b)=>b.jumlah-a.jumlah).slice(0,5);

  const events = [];
  state.loans.forEach(l=>{
    events.push({type:"pinjam", nama:l.nama, judul:l.judulBuku, tanggal:l.tanggalPinjam});
    if(l.tanggalKembali) events.push({type:"kembali", nama:l.nama, judul:l.judulBuku, tanggal:l.tanggalKembali});
  });
  events.sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
  const recent = events.slice(0,6);

  return `
    <div class="stat-grid">
      ${statCard("Total Koleksi", state.books.length, "var(--plum)", "▤")}
      ${statCard("Sedang Dipinjam", al.length, "var(--rose)", "◔")}
      ${statCard("Dikembalikan Bulan Ini", returnedThisMonth, "var(--gold)", "✓")}
      ${statCard("Peminjam Aktif", anggotaAktif, "#3F5B7A", "☺")}
    </div>
    ${overdueCount>0 ? `<div class="alert-overdue">⚠ ${overdueCount} peminjaman sudah lebih dari 7 hari — cek tab Peminjaman Aktif.</div>` : ""}
    <div class="dash-grid">
      <div class="panel">
        <h3 class="panel-title">Peminjaman per Kelas</h3>
        ${perKelas.length===0 ? `<div class="muted">Belum ada data peminjaman.</div>` : `
          <div class="chart-bars">
            ${perKelas.map(p=>`
              <div class="chart-col">
                <div class="chart-val">${p.jumlah}</div>
                <div class="chart-bar" style="height:${Math.max(8,(p.jumlah/maxJumlah)*160)}px"></div>
                <div class="chart-lbl">Kls ${esc(p.kelas)}</div>
              </div>
            `).join("")}
          </div>
        `}
      </div>
      <div class="panel">
        <h3 class="panel-title">Buku Terpopuler</h3>
        ${topBuku.length===0 ? `<div class="muted">Belum ada data.</div>` : `
          <div class="top-list">
            ${topBuku.map((b,i)=>`
              <div class="top-item">
                <div class="top-rank">${i+1}</div>
                <div class="top-title">${esc(b.judul)}</div>
                <div class="top-count">${b.jumlah}×</div>
              </div>
            `).join("")}
          </div>
        `}
      </div>
    </div>
    <div class="panel" style="margin-top:20px;">
      <h3 class="panel-title">Aktivitas Terbaru</h3>
      ${recent.length===0 ? `<div class="muted">Belum ada aktivitas.</div>` : recent.map(e=>`
        <div class="activity-item">
          <span>${e.type==='pinjam' ? '📖' : '↺'}</span>
          <span><b>${esc(e.nama)}</b> ${e.type==='pinjam'?'meminjam':'mengembalikan'} <i>${esc(e.judul)}</i></span>
          <span class="activity-time">${fmt(e.tanggal)}</span>
        </div>
      `).join("")}
    </div>
  `;
}
function statCard(label, value, color, icon){
  return `
    <div class="stat-card">
      <div class="stat-blob" style="background:${color}"></div>
      <div class="stat-icon" style="background:${color}">${icon}</div>
      <div class="stat-value">${value}</div>
      <div class="stat-label">${label}</div>
    </div>
  `;
}

function bindKatalogToolbar(){

  document.getElementById("btnTambahBuku").addEventListener("click", openAddBook);

function renderKatalogGrid(){
  const grid = document.getElementById("katalogGrid");
  const q = state.search.toLowerCase();
  const list = state.books
    .map(b=>({...b, status: isDipinjam(b.kode)?"dipinjam":"tersedia"}))
    .filter(b=>{
      const matchQ = b.judul.toLowerCase().includes(q) || b.penyusun.toLowerCase().includes(q) || b.kode.toLowerCase().includes(q);
      const matchKat = state.katFilter==="Semua" || b.kategori===state.katFilter;
      const matchStatus = state.statusFilter==="Semua" || b.status===state.statusFilter;
      return matchQ && matchKat && matchStatus;
    })
    .sort((a,b)=>a.kode.localeCompare(b.kode));

  if(list.length===0){ grid.innerHTML = `<div class="muted" style="text-align:center;padding:60px 0;">Tidak ada buku yang cocok.</div>`; return; }

  grid.innerHTML = `<div class="book-grid">
    ${list.map(b=>{
      const kat = katByKode(b.kategori);
      const loanRec = activeLoans().find(l=>l.kodeBuku===b.kode);
      const late = loanRec ? isOverdue(loanRec) : false;
      const stubLabel = b.status==='dipinjam' ? (late?'Terlambat':'Dipinjam') : 'Tersedia';
      const stubColor = b.status==='dipinjam' ? 'var(--rose)' : 'var(--plum)';
      return `
        <div class="book-card">
          <div class="row-between">
            <span class="kode-chip" style="background:${kat.color}">${esc(b.kode)}</span>
            <span class="due-stub" style="border:1.5px solid ${stubColor};color:${stubColor};${b.status==='dipinjam'&&late?'background:var(--rose-soft);':''}">
              <span class="due-dot" style="background:${stubColor}"></span>${stubLabel}
            </span>
          </div>
          <div class="kat-label" style="color:${kat.color}">${esc(kat.nama)}</div>
          <h3 class="book-title">${esc(b.judul)}</h3>
          <p class="book-meta">${esc(b.penyusun)} · ${esc(b.penerbit)}</p>
          <p class="book-meta small">Terbit ${esc(b.tahunTerbit)} · ${esc(b.sumber)}${b.keterangan?` · ${esc(b.keterangan)}`:''}</p>
          ${loanRec ? `<p class="book-loan-note">Dipinjam ${esc(loanRec.nama)} (Kls ${esc(loanRec.kelas)}) sejak ${fmt(loanRec.tanggalPinjam)}</p>` : ""}
          <div class="book-actions">
            <button class="btn btn-primary" style="flex:1;justify-content:center;" data-loan="${esc(b.id)}" ${b.status==='dipinjam'?'disabled':''}>📖 Pinjamkan</button>
            <button class="icon-btn" data-edit="${esc(b.id)}">✎</button>
            <button class="icon-btn" data-del="${esc(b.id)}">🗑</button>
          </div>
        </div>
      `;
    }).join("")}
  </div>`;

  grid.querySelectorAll("[data-loan]").forEach(btn=>btn.addEventListener("click", ()=>openLoanModal(btn.dataset.loan)));
  grid.querySelectorAll("[data-edit]").forEach(btn=>btn.addEventListener("click", ()=>openEditBook(btn.dataset.edit)));
  grid.querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click", ()=>deleteBook(btn.dataset.del)));
}

/* ============ BOOK ADD/EDIT ============ */
function openAddBook(){
  if(state.kategoriList.length===0){ showToast("Tambahkan kategori dulu lewat 'Kelola Kategori'", "rose"); state.katModalOpen=true; renderModal(); return; }
  const kat = state.kategoriList[0].kode;
  state.bookModal = { mode:"add", data:{ kategori:kat, kode:suggestKode(kat, state.books), judul:"", penyusun:"", penerbit:"", tahunTerbit:"", sumber:"Beli", tanggalDiterima: iso(todayDate), keterangan:"" } };
  renderModal();
}
function openEditBook(id){
  const b = state.books.find(x=>x.id===id);
  if(!b) return;
  state.bookModal = { mode:"edit", data:{...b} };
  renderModal();
}
function deleteBook(id){
  const b = state.books.find(x=>x.id===id);
  if(!b) return;
  if(isDipinjam(b.kode)){ showToast("Tidak bisa dihapus — buku sedang dipinjam", "rose"); return; }
  if(confirm(`Hapus "${b.judul}" (${b.kode}) dari katalog?`)){
    state.books = state.books.filter(x=>x.id!==id);
    scheduleSave();
    showToast("Buku dihapus dari katalog", "rose");
    renderContent();
  }
}
function saveBookFromForm(){
  const m = state.bookModal;
  const data = {
    ...m.data,
    kategori: document.getElementById("f_kategori").value,
    kode: document.getElementById("f_kode").value.trim().toUpperCase(),
    judul: document.getElementById("f_judul").value.trim(),
    penyusun: document.getElementById("f_penyusun").value.trim(),
    penerbit: document.getElementById("f_penerbit").value.trim(),
    tahunTerbit: document.getElementById("f_tahun").value.trim(),
    sumber: m.data.sumber,
    tanggalDiterima: document.getElementById("f_tanggal").value,
    keterangan: document.getElementById("f_ket").value.trim(),
  };
  if(!data.judul){ showToast("Judul buku tidak boleh kosong", "rose"); return; }
  if(!data.kode){ showToast("Kode buku tidak boleh kosong", "rose"); return; }
  const dupe = state.books.some(b=>b.kode===data.kode && b.id!==data.id);
  if(dupe){ showToast(`Kode ${data.kode} sudah dipakai buku lain`, "rose"); return; }

  if(m.mode==="add"){
    state.books.push({...data, id:uid()});
    showToast(`Buku "${data.judul}" (${data.kode}) ditambahkan ke katalog`, "plum");
  }else{
    const old = state.books.find(b=>b.id===data.id);
    const oldKode = old.kode;
    state.books = state.books.map(b=> b.id===data.id ? data : b);
    if(oldKode !== data.kode){
      state.loans = state.loans.map(l=> l.kodeBuku===oldKode ? {...l, kodeBuku:data.kode} : l);
    }
    showToast(`Data buku "${data.judul}" diperbarui`, "plum");
  }
  scheduleSave();
  state.bookModal = null;
  renderModal();
  renderContent();
}

/* ============ PEMINJAMAN ============ */
function openLoanModal(bookId){
  const b = state.books.find(x=>x.id===bookId);
  if(!b) return;
  state.loanTarget = b;
  renderModal();
}
function confirmLoanFromForm(){
  const nama = document.getElementById("l_nama").value.trim();
  const kelas = document.getElementById("l_kelas").value;
  if(!nama){ showToast("Nama siswa tidak boleh kosong", "rose"); return; }
  const b = state.loanTarget;
  state.loans.unshift({ id:uid(), kodeBuku:b.kode, judulBuku:b.judul, nama, kelas, tanggalPinjam: iso(todayDate), tanggalKembali:null, status:"dipinjam" });
  showToast(`"${b.judul}" dipinjamkan ke ${nama}`, "plum");
  scheduleSave();
  state.loanTarget = null;
  renderModal();
  renderContent();
}
function returnLoan(id){
  const l = state.loans.find(x=>x.id===id);
  if(!l) return;
  state.loans = state.loans.map(x=> x.id===id ? {...x, status:"dikembalikan", tanggalKembali: iso(todayDate)} : x);
  scheduleSave();
  showToast(`"${l.judulBuku}" dikembalikan oleh ${l.nama}`, "rose");
  renderContent();
}

/* ============ KATEGORI MANAGEMENT ============ */
function addKategoriFromForm(){
  const kode = document.getElementById("nk_kode").value.trim().toUpperCase();
  const nama = document.getElementById("nk_nama").value.trim();
  if(!kode || !nama) return;
  if(state.kategoriList.some(k=>k.kode===kode)){ showToast(`Kode kategori "${kode}" sudah ada`, "rose"); return; }
  state.kategoriList.push({ kode, nama, color: KAT_PALETTE[state.kategoriList.length % KAT_PALETTE.length] });
  scheduleSave();
  renderModal();
}
function updateKategoriField(oldKode, field, value){
  if(field==="kode"){
    const nk = value.trim().toUpperCase();
    if(!nk) return;
    if(state.kategoriList.some(k=>k.kode===nk && k.kode!==oldKode)){ showToast(`Kode kategori "${nk}" sudah dipakai`, "rose"); renderModal(); return; }
    state.kategoriList = state.kategoriList.map(k=> k.kode===oldKode ? {...k, kode:nk} : k);
    state.books = state.books.map(b=> b.kategori===oldKode ? {...b, kategori:nk} : b);
    if(state.katFilter===oldKode) state.katFilter = nk;
  }else{
    state.kategoriList = state.kategoriList.map(k=> k.kode===oldKode ? {...k, [field]:value} : k);
  }
  scheduleSave();
}
function deleteKategoriRow(kode){
  if(state.books.some(b=>b.kategori===kode)){ showToast("Pindahkan dulu buku dari kategori ini sebelum menghapusnya", "rose"); return; }
  if(confirm(`Hapus kategori "${kode}"?`)){
    state.kategoriList = state.kategoriList.filter(k=>k.kode!==kode);
    if(state.katFilter===kode) state.katFilter="Semua";
    scheduleSave();
    renderModal();
  }
}

        </div>
        <div class="hint" style="margin:10px 0 16px;">Tanggal pinjam: ${fmt(todayDate)}</div>
        <button class="btn btn-primary btn-block" id="confirmLoanBtn">Konfirmasi Peminjaman</button>
      </div>
    </div>
  `;
}
function bindLoanModal(){
  document.getElementById("loanBackdrop").addEventListener("click", e=>{ if(e.target.id==="loanBackdrop"){ state.loanTarget=null; renderModal(); } });
  document.getElementById("closeLoanModal").addEventListener("click", ()=>{ state.loanTarget=null; renderModal(); });
  document.getElementById("confirmLoanBtn").addEventListener("click", confirmLoanFromForm);
  document.getElementById("l_nama").focus();
}

function katModalHTML(){
  return `
    <div class="modal-backdrop" id="katBackdrop">
      <div class="modal" style="max-width:460px;">
        <div class="modal-header" style="margin-bottom:2px;">
          <h3 class="modal-title">Kelola Kategori</h3>
          <button class="close-x" id="closeKatModal">✕</button>
        </div>
        <p class="hint" style="margin:2px 0 14px;">Kode dan nama kategori sepenuhnya bebas — sesuaikan dengan sistem klasifikasi maktabah kalian sendiri.</p>
        <div>
          ${state.kategoriList.length===0 ? `<div class="muted">Belum ada kategori. Tambahkan di bawah.</div>` : state.kategoriList.map(k=>`
            <div class="kat-row">
              <input type="color" class="kat-swatch" value="${esc(k.color)}" data-kat-color="${esc(k.kode)}" />
              <input class="kat-input-kode" value="${esc(k.kode)}" data-kat-kode="${esc(k.kode)}" />
              <input class="kat-input-nama" value="${esc(k.nama)}" data-kat-nama="${esc(k.kode)}" />
              <button class="kat-del" data-kat-del="${esc(k.kode)}">🗑</button>
            </div>
          `).join("")}
        </div>
        <div style="border-top:1px dashed var(--line);padding-top:14px;margin-top:6px;">
          <label class="field-label">Tambah Kategori Baru</label>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
            <input id="nk_kode" placeholder="Kode" style="width:72px;font-family:var(--mono);text-transform:uppercase;" />
            <input id="nk_nama" placeholder="Nama kategori" style="flex:1;min-width:0;" />
            <button class="btn btn-primary" id="addKatBtn">Tambah</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function bindKatModal(){
  document.getElementById("katBackdrop").addEventListener("click", e=>{ if(e.target.id==="katBackdrop"){ state.katModalOpen=false; renderModal(); renderContent(); } });
  document.getElementById("closeKatModal").addEventListener("click", ()=>{ state.katModalOpen=false; renderModal(); renderContent(); });
  document.getElementById("addKatBtn").addEventListener("click", addKategoriFromForm);
  document.querySelectorAll("[data-kat-color]").forEach(inp=>inp.addEventListener("change", e=>updateKategoriField(inp.dataset.katColor, "color", e.target.value)));
  document.querySelectorAll("[data-kat-kode]").forEach(inp=>inp.addEventListener("change", e=>{ updateKategoriField(inp.dataset.katKode, "kode", e.target.value); renderModal(); }));
  document.querySelectorAll("[data-kat-nama]").forEach(inp=>inp.addEventListener("change", e=>updateKategoriField(inp.dataset.katNama, "nama", e.target.value)));
  document.querySelectorAll("[data-kat-del]").forEach(btn=>btn.addEventListener("click", ()=>deleteKategoriRow(btn.dataset.katDel)));
}

/* ============ BOOTSTRAP ============ */
(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
